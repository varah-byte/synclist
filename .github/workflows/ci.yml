name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:dev@localhost:5432/postgres
      JWT_SECRET: ci-secret
      PORT: "3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: CRDT unit and property tests
        run: npx vitest run
        working-directory: packages/crdt
      - name: Create DB schema
        run: npm run db:init
        working-directory: apps/server
      - name: Start server
        run: |
          nohup npm run dev > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/health && break || sleep 1; done
        working-directory: apps/server
      - name: Integration test
        run: npx vitest run src/integration.test.ts
        working-directory: apps/server
      - name: Build client
        run: npm run build
        working-directory: apps/client
